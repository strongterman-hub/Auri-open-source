name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './server[dev]'
      - run: python scripts/check_source.py
      - run: python -m pytest -q
        working-directory: server
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          TOOLS=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$TOOLS" ]; then
            dirname "$TOOLS" >> "$GITHUB_PATH"
          fi
          ls "$SDK/cmdline-tools" || true
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:testStoreDebugUnitTest :app:assembleStoreDebug :app:assembleDirectDebug --console=plain
        working-directory: android
