<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · Auri 管理后台</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #4c8dff;
    --red: #e74c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2330 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 26px; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 14px 0 6px; }
  input {
    width: 100%;
    background: #11141a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 24px;
    background: var(--accent);
    color: #fff;
    border: 0;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    display: none;
    margin-top: 14px;
    color: var(--red);
    font-size: 13px;
  }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <h1>Auri 管理后台</h1>
    <p class="sub">日志 · Token 消耗 · 费用统计</p>

    <label for="username">账号</label>
    <input id="username" name="username" type="text" required autofocus />

    <label for="password">密码</label>
    <input id="password" name="password" type="password" required />

    <button id="submit" type="submit">登 录</button>
    <div class="error" id="error"></div>
  </form>

<script>
const form = document.getElementById("form");
const submit = document.getElementById("submit");
const error = document.getElementById("error");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  error.style.display = "none";
  submit.disabled = true;
  submit.textContent = "登录中…";
  try {
    const res = await fetch("/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    if (res.ok) {
      window.location.href = "/admin";
      return;
    }
    let message = "登录失败";
    try {
      const data = await res.json();
      message = data.detail || message;
    } catch (_) {}
    error.textContent = message;
    error.style.display = "block";
  } catch (_) {
    error.textContent = "网络错误，请重试";
    error.style.display = "block";
  } finally {
    submit.disabled = false;
    submit.textContent = "登 录";
  }
});
</script>
</body>
</html>
